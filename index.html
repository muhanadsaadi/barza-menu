<!DOCTYPE html>
<!--
  Barza Menu — bilingual QR menu (Arabic / English)
  =================================================
  This file is only the "skeleton" of the page.
  All the content (restaurant name, categories, items) is filled in
  by js/app.js after it reads config.json and menu.json.
-->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>القائمة | Menu</title>
  <meta name="description" content="قائمة طعام رقمية ثنائية اللغة مع الطلب عبر واتساب — Bilingual digital menu with WhatsApp ordering">
  <meta name="theme-color" content="#0F5257">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Skip link: lets keyboard users jump straight to the menu -->
  <a class="skip-link" href="#menu" data-i18n="skip">تخطَّ إلى القائمة</a>

  <!-- Demo notice (shown only when "demo": true in config.json) -->
  <div class="demo-banner" id="demoBanner" hidden data-i18n="demo">
    هذه قائمة تجريبية لمقهى خيالي — ليست نشاطاً تجارياً حقيقياً
  </div>

  <!-- ===== Header: logo, name, open/closed status, language toggle ===== -->
  <header class="site-header">
    <div class="brand">
      <img id="logo" class="brand-logo" src="assets/logo.svg" alt="" width="56" height="56">
      <div>
        <h1 id="restaurantName">…</h1>
        <p id="tagline" class="tagline"></p>
        <p class="meta">
          <span id="openStatus" class="status-pill"></span>
          <span id="hoursLabel"></span>
        </p>
      </div>
    </div>
    <button id="langToggle" class="lang-toggle" type="button" aria-label="Switch to English">EN</button>
  </header>

  <!-- ===== Search + category tabs (sticky while scrolling) ===== -->
  <div class="toolbar" id="toolbar">
    <label class="search">
      <span class="visually-hidden" data-i18n="searchLabel">ابحث في القائمة</span>
      <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M10 4a6 6 0 1 0 3.7 10.7l4.8 4.8 1.4-1.4-4.8-4.8A6 6 0 0 0 10 4zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
      <input id="search" type="search" autocomplete="off" data-i18n-placeholder="searchPh" placeholder="ابحث: كرك، لاتيه…">
    </label>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Categories"></nav>
  </div>

  <!-- ===== Menu items are rendered here ===== -->
  <main id="menu" class="menu" aria-live="polite"></main>
  <p id="emptyState" class="empty" hidden data-i18n="noResults">لا توجد نتائج مطابقة</p>

  <footer class="site-footer">
    <p id="location"></p>
    <p>
      <span data-i18n="madeBy">صُنعت بواسطة</span>
      <a href="https://wa.me/96876632622" target="_blank" rel="noopener">برزة | Barza</a>
    </p>
  </footer>

  <!-- ===== Floating cart bar (visible when cart has items) ===== -->
  <button id="cartBar" class="cart-bar" type="button" hidden>
    <span class="cart-count" id="cartCount" aria-live="polite">0</span>
    <span data-i18n="viewCart">عرض السلة</span>
    <strong id="cartBarTotal"></strong>
  </button>

  <!-- ===== Cart dialog (native <dialog> = accessible modal for free) ===== -->
  <dialog id="cartDialog" class="cart-dialog" aria-labelledby="cartTitle">
    <div class="cart-head">
      <h2 id="cartTitle" data-i18n="cart">سلتك</h2>
      <button type="button" class="icon-btn" id="closeCart" data-i18n-aria="close" aria-label="إغلاق">✕</button>
    </div>

    <ul id="cartList" class="cart-list"></ul>

    <form id="orderForm" class="order-form">
      <label>
        <span data-i18n="name">الاسم (اختياري)</span>
        <input id="custName" type="text" autocomplete="name" maxlength="60">
      </label>
      <label>
        <span data-i18n="table">رقم الطاولة / استلام</span>
        <input id="custTable" type="text" maxlength="30" data-i18n-placeholder="tablePh" placeholder="مثال: طاولة ٤ أو استلام من السيارة">
      </label>
      <label>
        <span data-i18n="notes">ملاحظات</span>
        <textarea id="custNotes" rows="2" maxlength="200" data-i18n-placeholder="notesPh" placeholder="مثال: بدون سكر"></textarea>
      </label>

      <div class="cart-total">
        <span data-i18n="total">المجموع</span>
        <strong id="cartTotal"></strong>
      </div>

      <button type="submit" class="whatsapp-btn">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>
        <span data-i18n="orderWa">اطلب عبر واتساب</span>
      </button>
      <button type="button" class="link-btn" id="clearCart" data-i18n="clear">إفراغ السلة</button>
    </form>
  </dialog>

  <!-- Small toast message ("Added to cart") -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
